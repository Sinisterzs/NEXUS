name: NEXUS Stable Release

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch ou Commit SHA oficial homologado para compilação'
        required: true
        default: 'release/v0.2.0'
        type: string
      version:
        description: 'Versão SemVer Oficial (deve ser estritamente 0.2.0)'
        required: true
        default: '0.2.0'
        type: string
      release_notes:
        description: 'Resumo das notas de lançamento para o manifesto do updater'
        required: false
        default: 'NEXUS v0.2.0 — Versão Estável Oficial com Redesign UI 2.0, Temas Globais e Segurança TOFU.'
        type: string

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  build-and-publish-stable:
    name: Build & Publish Stable (Windows Release)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository at Target Ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref }}
          fetch-depth: 0

      - name: Strict Origin & Version Verification Guard
        shell: pwsh
        run: |
          $expectedVersion = "${{ github.event.inputs.version }}".Trim()
          if ($expectedVersion -ne "0.2.0") {
            Write-Error "[FALHA CRÍTICA] A versão informada '$expectedVersion' não é 0.2.0! O workflow Stable v0.2.0 rejeita qualquer outra versão."
            exit 1
          }

          $headSha = (git rev-parse HEAD).Trim()
          Write-Host "[INFO] Commit HEAD sob compilação: $headSha"

          $pkgJson = Get-Content package.json | ConvertFrom-Json
          $tauriJson = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $versionTs = Get-Content src/version.ts -Raw

          Write-Host "[INFO] package.json version: $($pkgJson.version)"
          Write-Host "[INFO] tauri.conf.json version: $($tauriJson.version)"

          if ($pkgJson.version -ne "0.2.0" -or $tauriJson.version -ne "0.2.0" -or -not ($versionTs -match "APP_VERSION = '0.2.0'")) {
            Write-Error "[FALHA CRÍTICA] Inconsistência nos metadados de versão do commit! Todos os arquivos devem estar sincronizados em 0.2.0 antes do build."
            exit 1
          }

          Write-Host "[OK] Todas as verificações de guarda de origem e versionamento foram validadas com sucesso."

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Automated Test Verification
        run: npm test

      - name: Build Frontend
        run: npm run build

      - name: Verify Signing Key Configuration
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            Write-Error "O GitHub Secret 'TAURI_SIGNING_PRIVATE_KEY' não está configurado. A chave privada é necessária para assinar o instalador de atualização."
            exit 1
          }
          Write-Host "Chave de assinatura detectada no repositório."

      - name: Build Native Windows Release with Tauri (NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Generate Stable Updater Manifest (latest.json)
        run: node scripts/generate-stable-manifest.cjs "${{ github.event.inputs.version }}" "${{ github.event.inputs.release_notes }}"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Strict Security Audit of Artifacts
        run: node scripts/audit-nightly-artifacts.cjs

      - name: Validate Artifacts Integrity Before Publishing
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $exeFiles = Get-ChildItem -Path $nsisDir -Filter "*$ver*-setup.exe"
          $sigFiles = Get-ChildItem -Path $nsisDir -Filter "*$ver*-setup.exe.sig"

          if ($exeFiles.Count -eq 0) {
            Write-Error "[FALHA CRÍTICA] Instalador NSIS da versão $ver não foi encontrado em $nsisDir."
            exit 1
          }

          $exe = $exeFiles[0]
          if ($exe.Length -lt 10MB) {
            Write-Error "[FALHA CRÍTICA] Instalador $($exe.Name) tem tamanho anormalmente baixo ($($exe.Length) bytes)."
            exit 1
          }

          if ($sigFiles.Count -eq 0) {
            Write-Error "[FALHA CRÍTICA] Arquivo de assinatura .sig da versão $ver não foi encontrado em $nsisDir."
            exit 1
          }

          if (-not (Test-Path "latest.json")) {
            Write-Error "[FALHA CRÍTICA] Manifesto latest.json não foi gerado na raiz."
            exit 1
          }

          $manifest = Get-Content "latest.json" | ConvertFrom-Json
          if ($manifest.version -ne $ver) {
            Write-Error "[FALHA CRÍTICA] Versão do latest.json ($($manifest.version)) diverge de $ver."
            exit 1
          }

          Write-Host "[OK] Artefatos validados: $($exe.Name) ($([math]::Round($exe.Length/1MB, 2)) MB), Assinatura e Manifesto prontos para publicação."

      - name: Prepare Markdown Release Notes Body
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          $customNotesFile = "scripts/release-notes-v$ver.md"
          if (Test-Path $customNotesFile) {
            Write-Host "Encontradas notas ricas em Markdown: $customNotesFile"
            Copy-Item $customNotesFile -Destination "release-notes-body.md"
          } else {
            Write-Host "Utilizando notas padrão informadas no input do workflow."
            $defaultBody = @"
          ## 🚀 NEXUS Stable Release — v$ver

          ${{ github.event.inputs.release_notes }}

          ---

          ### Artefatos de Instalação:
          - **Instalador NSIS:** Instalador oficial assinado com Minisign.
          - **Manifesto de Atualização:** ``latest.json``
          "@
            Set-Content -Path "release-notes-body.md" -Value $defaultBody -Encoding utf8
          }

      - name: Publish GitHub Release (Stable Channel)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          name: NEXUS v${{ github.event.inputs.version }} (Stable)
          body_path: release-notes-body.md
          draft: false
          prerelease: false
          make_latest: 'true'
          files: |
            src-tauri/target/release/nexus.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
