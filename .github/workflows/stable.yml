name: NEXUS Stable Release

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch ou Commit SHA oficial homologado para compilação'
        required: true
        default: 'release/v0.2.0'
        type: string
      version:
        description: 'Versão SemVer Oficial (deve ser estritamente 0.2.0)'
        required: true
        default: '0.2.0'
        type: string
      release_notes:
        description: 'Resumo das notas de lançamento para o manifesto do updater'
        required: false
        default: 'NEXUS v0.2.0 — Versão Estável Oficial com Redesign UI 2.0, Temas Globais e Segurança TOFU.'
        type: string

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  build-and-publish-stable:
    name: Build & Publish Stable (Windows Release)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository at Target Ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref }}
          fetch-depth: 0

      - name: Capture & Validate Target Commit
        id: commit_info
        shell: pwsh
        run: |
          $compiledSha = (git rev-parse HEAD).Trim()
          Write-Host "[INFO] Commit compilado (HEAD): $compiledSha"
          echo "compiled_sha=$compiledSha" >> $env:GITHUB_OUTPUT

          # Valida que o commit descende da base homologada da Nightly.7 (52a9ed6)
          git merge-base --is-ancestor 52a9ed6 $compiledSha
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[FALHA CRÍTICA] O commit $compiledSha não descende da base funcional homologada 52a9ed6 (v0.1.9-nightly.7)!"
            exit 1
          }
          Write-Host "[OK] Base funcional homologada 52a9ed6 confirmada como ancestral do commit."

      - name: Strict Origin & Version Verification Guard
        shell: pwsh
        run: |
          $expectedVersion = "${{ github.event.inputs.version }}".Trim()
          if ($expectedVersion -ne "0.2.0") {
            Write-Error "[FALHA CRÍTICA] A versão informada '$expectedVersion' não é 0.2.0! O workflow Stable v0.2.0 rejeita qualquer outra versão."
            exit 1
          }

          $pkgJson = Get-Content package.json | ConvertFrom-Json
          $tauriJson = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $versionTs = Get-Content src/version.ts -Raw

          Write-Host "[INFO] package.json version: $($pkgJson.version)"
          Write-Host "[INFO] tauri.conf.json version: $($tauriJson.version)"

          if ($pkgJson.version -ne "0.2.0" -or $tauriJson.version -ne "0.2.0" -or -not ($versionTs -match "APP_VERSION = '0.2.0'")) {
            Write-Error "[FALHA CRÍTICA] Inconsistência nos metadados de versão do commit! Todos os arquivos devem estar sincronizados em 0.2.0 antes do build."
            exit 1
          }

          Write-Host "[OK] Metadados de versão validados com sucesso."

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Automated Test Verification
        run: npm test

      - name: Build Frontend
        run: npm run build

      - name: Verify Signing Key Configuration
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            Write-Error "O GitHub Secret 'TAURI_SIGNING_PRIVATE_KEY' não está configurado. A chave privada é necessária para assinar o instalador de atualização."
            exit 1
          }
          Write-Host "Chave de assinatura detectada no repositório."

      - name: Build Native Windows Release with Tauri (NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Generate Stable Updater Manifest (latest.json)
        run: node scripts/generate-stable-manifest.cjs "${{ github.event.inputs.version }}" "${{ github.event.inputs.release_notes }}"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Strict Security Audit of Artifacts
        run: node scripts/audit-nightly-artifacts.cjs

      - name: Validate Local Artifacts Integrity Before Upload
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $exeFiles = Get-ChildItem -Path $nsisDir -Filter "*$ver*-setup.exe"
          $sigFiles = Get-ChildItem -Path $nsisDir -Filter "*$ver*-setup.exe.sig"

          if ($exeFiles.Count -eq 0) {
            Write-Error "[FALHA CRÍTICA] Instalador NSIS da versão $ver não foi encontrado em $nsisDir."
            exit 1
          }

          $exe = $exeFiles[0]
          Write-Host "[INFO] Instalador detectado: $($exe.Name) ($([math]::Round($exe.Length/1MB, 2)) MB)"
          if ($exe.Length -lt 3MB -or $exe.Length -gt 50MB) {
            Write-Error "[FALHA CRÍTICA] Instalador $($exe.Name) tem tamanho fora do intervalo esperado de 3 MB a 50 MB ($($exe.Length) bytes)."
            exit 1
          }

          if ($sigFiles.Count -eq 0) {
            Write-Error "[FALHA CRÍTICA] Arquivo de assinatura .sig da versão $ver não foi encontrado em $nsisDir."
            exit 1
          }

          $sig = $sigFiles[0]
          if ($sig.Length -lt 50 -or $sig.Length -gt 10KB) {
            Write-Error "[FALHA CRÍTICA] Arquivo de assinatura $($sig.Name) tem tamanho anormal ($($sig.Length) bytes)."
            exit 1
          }

          if (-not (Test-Path "latest.json")) {
            Write-Error "[FALHA CRÍTICA] Manifesto latest.json não foi gerado na raiz."
            exit 1
          }

          $manifest = Get-Content "latest.json" | ConvertFrom-Json
          if ($manifest.version -ne $ver) {
            Write-Error "[FALHA CRÍTICA] Versão do latest.json ($($manifest.version)) diverge de $ver."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($manifest.platforms.'windows-x86_64'.signature)) {
            Write-Error "[FALHA CRÍTICA] Assinatura Minisign ausente no manifesto latest.json."
            exit 1
          }

          Write-Host "[OK] Artefatos locais validados: $($exe.Name), Assinatura e Manifesto prontos para upload."

      - name: Prepare Markdown Release Notes Body
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          $customNotesFile = "scripts/release-notes-v$ver.md"
          if (Test-Path $customNotesFile) {
            Write-Host "Encontradas notas ricas em Markdown: $customNotesFile"
            Copy-Item $customNotesFile -Destination "release-notes-body.md"
          } else {
            Write-Host "Utilizando notas padrão informadas no input do workflow."
            $defaultBody = @"
          ## 🚀 NEXUS Stable Release — v$ver

          ${{ github.event.inputs.release_notes }}

          ---

          ### Artefatos de Instalação:
          - **Instalador NSIS:** Instalador oficial assinado com Minisign.
          - **Manifesto de Atualização:** ``latest.json``
          "@
            Set-Content -Path "release-notes-body.md" -Value $defaultBody -Encoding utf8
          }

      - name: Publish GitHub Release (as Protected Draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          target_commitish: ${{ steps.commit_info.outputs.compiled_sha }}
          name: NEXUS v${{ github.event.inputs.version }} (Stable)
          body_path: release-notes-body.md
          draft: true
          prerelease: false
          make_latest: 'false'
          files: |
            src-tauri/target/release/nexus.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Uploaded Assets & Promote Draft to Public Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ github.event.inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          Write-Host "[INFO] Consultando release Draft para $env:TAG_NAME no repositório $env:REPO..."
          
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "User-Agent" = "NEXUS-Release-Promoter"
          }

          $apiUrl = "https://api.github.com/repos/$env:REPO/releases"
          $releases = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Get
          $draftRelease = $releases | Where-Object { $_.tag_name -eq $env:TAG_NAME -and $_.draft -eq $true }

          if (-not $draftRelease) {
            Write-Error "[FALHA CRÍTICA] Release Draft para a tag $env:TAG_NAME não foi encontrada."
            exit 1
          }

          $releaseId = $draftRelease.id
          Write-Host "[INFO] Release Draft localizada com ID: $releaseId"

          $assets = $draftRelease.assets
          Write-Host "[INFO] Quantidade de assets enviados: $($assets.Count)"
          $assets | ForEach-Object { Write-Host "  - $($_.name) ($([math]::Round($_.size/1MB, 2)) MB, state: $($_.state))" }

          $verNum = $env:TAG_NAME.TrimStart('v')
          $requiredAssets = @(
            "nexus.exe",
            "nexus_${verNum}_x64-setup.exe",
            "nexus_${verNum}_x64-setup.exe.sig",
            "latest.json"
          )

          foreach ($req in $requiredAssets) {
            $found = $assets | Where-Object { $_.name -eq $req -and $_.state -eq "uploaded" -and $_.size -gt 0 }
            if (-not $found) {
              Write-Error "[FALHA CRÍTICA] Asset obrigatório '$req' ausente ou corrompido no draft da release. A release permanecerá em Draft para evitar publicação incompleta."
              exit 1
            }
          }

          Write-Host "[OK] Todos os 4 assets obrigatórios foram carregados e validados com 100% de sucesso."
          Write-Host "[INFO] Promovendo a release de Draft para Pública (Latest)..."

          $updateUrl = "https://api.github.com/repos/$env:REPO/releases/$releaseId"
          $updateBody = @{
            draft = $false
            make_latest = "true"
          } | ConvertTo-Json

          $promoted = Invoke-RestMethod -Uri $updateUrl -Headers $headers -Method Patch -Body $updateBody -ContentType "application/json"

          if ($promoted.draft -eq $false) {
            Write-Host "[SUCESSO] Release $($promoted.name) ($($promoted.tag_name)) promovida a pública com sucesso!"
            Write-Host "[INFO] URL oficial: $($promoted.html_url)"
          } else {
            Write-Error "[FALHA CRÍTICA] Falha ao promover release para pública."
            exit 1
          }

      - name: Synchronize README Stable Channel
        if: success()
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main
          git checkout main
          node scripts/sync-readme-release.cjs --channel stable --version "${{ github.event.inputs.version }}"
          $diff = git status --porcelain README.md
          if ($diff) {
            git add README.md
            git commit -m "docs: sync README with Stable v${{ github.event.inputs.version }} [skip ci]"
            git push origin main
          } else {
            Write-Host "[INFO] README.md já estava atualizado para a versão Stable."
          }
