name: NEXUS Nightly Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão SemVer Prerelease (ex: 0.1.9-nightly.1)'
        required: true
        default: '0.3.0-nightly.2'
        type: string
      release_notes:
        description: 'Notas de atualização da versão Nightly'
        required: false
        default: 'Build Nightly automatizado do NEXUS com as últimas alterações e validações.'
        type: string

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  build-and-publish-nightly:
    name: Build & Publish Nightly (Windows Release)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install NPM Dependencies
        run: npm ci

      - name: Apply Nightly Version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/set-nightly-version.cjs "$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git show-ref --verify --quiet "refs/tags/v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -eq 0) { throw "A tag já existe; releases anteriores não serão sobrescritas." }
          if ($LASTEXITCODE -ne 1) { throw "Falha ao verificar a existência da tag." }
          exit 0

      - name: Run Unit Tests and Typecheck
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Frontend
        run: npm run build

      - name: Verify Signing Key Configuration
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            Write-Error "O GitHub Secret 'TAURI_SIGNING_PRIVATE_KEY' não está configurado. A chave privada é necessária para assinar o instalador de atualização."
            exit 1
          }
          Write-Host "Chave de assinatura detectada no repositório."

      - name: Build Native Windows Release with Tauri (NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Generate Nightly Updater Manifest (latest-nightly.json)
        shell: pwsh
        run: node scripts/generate-nightly-manifest.cjs "$env:RELEASE_VERSION" "$env:RELEASE_NOTES"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Strict Security Audit of Artifacts
        run: node scripts/audit-nightly-artifacts.cjs

      - name: Prepare Markdown Release Notes Body
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $ver = $env:RELEASE_VERSION
          $customNotesFile = "scripts/release-notes-v$ver.md"
          if (Test-Path $customNotesFile) {
            Write-Host "Encontradas notas ricas em Markdown: $customNotesFile"
            Copy-Item $customNotesFile -Destination "release-notes-body.md"
          } else {
            Write-Host "Utilizando notas padrão informadas no input do workflow."
            $defaultBody = @"
          # NEXUS v$ver

          ### 🚀 Melhorias

          - $env:RELEASE_NOTES
          "@
            Set-Content -Path "release-notes-body.md" -Value $defaultBody -Encoding utf8
          }

      - name: Publish GitHub Pre-Release (Nightly Channel)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          name: NEXUS v${{ github.event.inputs.version }} (Nightly)
          body_path: release-notes-body.md
          draft: false
          prerelease: true
          make_latest: 'false'
          files: |
            src-tauri/target/release/nexus.exe
            src-tauri/target/release/bundle/nsis/nexus_${{ inputs.version }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/nexus_${{ inputs.version }}_x64-setup.exe.sig
            latest-nightly.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize README Beta Channel
        if: success()
        continue-on-error: true
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git clean -fd
          git fetch origin main:main
          git checkout main
          node scripts/sync-readme-release.cjs --channel beta --version "$env:RELEASE_VERSION"
          $diff = git status --porcelain README.md
          if ($diff) {
            git add README.md
            git commit -m "docs: sync README with Beta v$env:RELEASE_VERSION [skip ci]"
            git push origin main
          } else {
            Write-Host "[INFO] README.md já estava atualizado para a versão Beta."
          }
