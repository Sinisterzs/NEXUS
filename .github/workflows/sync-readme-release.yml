name: Sync README with Official Releases

on:
  workflow_dispatch:

concurrency:
  group: sync-readme-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-readme:
    name: Sync README Downloads Table
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run README sync tests
        run: |
          node --experimental-strip-types tests/sync_readme_release.test.ts
          node --experimental-strip-types tests/sync_readme_github.test.ts

      - name: Prepare automation branch safely
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          OPEN_PR=$(gh pr list --head docs/auto-sync-readme --state open --json number --jq '.[0].number // ""')
          if git ls-remote --exit-code --heads origin docs/auto-sync-readme >/dev/null 2>&1; then
            git fetch origin docs/auto-sync-readme
            if [ -n "$OPEN_PR" ]; then
              git checkout -b docs/auto-sync-readme origin/docs/auto-sync-readme
              git merge --no-edit origin/main
            elif git merge-base --is-ancestor origin/docs/auto-sync-readme origin/main; then
              git checkout -b docs/auto-sync-readme origin/main
            else
              echo "::error::Branch docs/auto-sync-readme has unmerged commits without an open PR. Manual inspection required."
              exit 1
            fi
          else
            git checkout -b docs/auto-sync-readme origin/main
          fi

      - name: Sync README from GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const { fetchGitHubReleases, syncReadmeFromReleases } = require("./scripts/sync-readme-github.cjs");
            (async () => {
              const releases = await fetchGitHubReleases({ owner: "Sinisterzs", repo: "NEXUS" });
              const current = fs.readFileSync("README.md", "utf8");
              const { content } = syncReadmeFromReleases({ readmeContent: current, releases });
              if (content !== current) {
                fs.writeFileSync("README.md", content, "utf8");
              }
            })().catch((err) => { console.error(err); process.exit(1); });
          '

      - name: Validate generated README and check diff
        id: diff
        run: |
          git diff --check
          node --experimental-strip-types tests/sync_readme_release.test.ts
          if git diff --quiet README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, push and create/reuse Pull Request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): sync official release downloads"
          git push origin docs/auto-sync-readme
          OPEN_PR=$(gh pr list --head docs/auto-sync-readme --state open --json number --jq '.[0].number // ""')
          if [ -z "$OPEN_PR" ]; then
            gh pr create --base main --head docs/auto-sync-readme --title "docs: sync official NEXUS downloads" --body "Atualiza automaticamente a seção de downloads do README com as versões oficiais mais recentes."
          fi
